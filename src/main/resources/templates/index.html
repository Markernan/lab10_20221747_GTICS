<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Empleados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema Empleados</a>
        <div class="navbar-nav">
            <a class="nav-link" href="#universidades">Universidades</a>
            <a class="nav-link" href="#reclutamiento">Reclutamiento</a>

            <a class="nav-link" href="#agentes">Gestión Agentes</a>
            <a class="nav-link" href="#dashboard">Dashboard</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <section id="universidades" class="mb-5">
        <h2>Universidades </h2>
        <div class="row" id="departamentos-container">
        </div>
    </section>

    <section id="reclutamiento" class="mb-5">
        <h2>Reclutamiento</h2>

        <button class="btn btn-success mb-3" id="reclutar-btn">Reclutar Nuevo Candidato</button>
        <div class="row" id="candidatos-container">

        </div>
    </section>

    <section id="agentes" class="mb-5">

        <h2>Gestión de Agentes</h2>
        <button class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#empleadoModal">Nuevo Agente</button>
        <div class="table-responsive">
            <table class="table table-striped" id="tabla-agentes">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Carrera</th>

                    <th>Universidad</th>

                    <th>Email</th>

                    <th>Estado</th>
                    <th>Acciones</th>

                </tr>
                </thead>
                <tbody id="empleados-body">
                </tbody>
            </table>
        </div>
    </section>

    <section id="dashboard" class="mb-5">
        <h2>Dashboard General</h2>
        <div class="row" id="estadisticas-container">
        </div>
    </section>
</div>

<div class="modal fade" id="empleadoModal" tabindex="-1">

    <div class="modal-dialog">


        <div class="modal-content">

            <div class="modal-header">
                <h5 class="modal-title" id="modalTitulo">Nuevo Empleado</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <form id="formEmpleado">
                    <input type="hidden" id="empleadoId">
                    <div class="mb-3">

                        <label class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombreCompleto" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Carrera</label>
                        <input type="text" class="form-control" id="carrera" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Departamento</label>
                        <select class="form-control" id="departamento" required>
                            <option value="">Seleccionar</option>
                            <option value="TI">Tecnología</option>
                            <option value="RH">Recursos Humanos</option>
                            <option value="Ventas">Ventas</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">País</label>
                        <input type="text" class="form-control" id="pais" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select class="form-control" id="estado" required>
                            <option value="Activo">Activo</option>
                            <option value="Inactivo">Inactivo</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="guardarEmpleado">Guardar</button>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/departments.js"></script>
<script src="js/recruiters.js"></script>
<script src="js/employees.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
